<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title"><title id="title">Campionario tipografico — esempio illustrativo Gliffo</title><rect x="0" y="0" width="1000" height="720" fill="#24262a" rx="0"/><text x="55" y="65" fill="#f4f1e9" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="600">La voce del brand.</text><text x="55" y="292" fill="#b7d050" font-family="Arial,Helvetica,sans-serif" font-size="245" font-weight="700">Aa</text><text x="435" y="161" fill="#f4f1e9" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="700">Forma alle idee.</text><text x="435" y="224" fill="#f4f1e9" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="400">Spazio ai caratteri.</text><text x="435" y="290" fill="#f4f1e9" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400">Un carattere cambia tutto.</text><path d="M55 350H945" fill="none" stroke="#f4f1e9" opacity="0.3"/><text x="55" y="425" fill="#f4f1e9" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400">ABCDEFGHIJKLMNOPQRSTUVWXYZ</text><text x="55" y="480" fill="#f4f1e9" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="400">abcdefghijklmnopqrstuvwxyz</text><text x="55" y="540" fill="#f4f1e9" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="400">0123456789  &amp;  @  !  ?  +  %</text><text x="55" y="650" fill="#b7d050" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">Campionario dimostrativo · Arial</text></svg>